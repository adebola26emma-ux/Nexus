<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="auth-page">
        <section class="visual-panel">

            <div class="brand">
                <h1>Nexus</h1>
                <p>Your Journey Begins Here.</p>
            </div>
            
            <div class="visual-content">
                <span>EXPLORE</span>
                <span>GROW</span>
                <span>ACHIEVE</span>
            </div>

        </section>

        <section class="auth-panel">
            <div class="auth-container">

                <header class="auth-header">

                    <h2 id="auth-title">Welcome Back</h2>
                    
                    <p id="auth-description">
                        Enter the Nexus and continue your journey.
                    </p>
                </header>

                <div class="auth-tabs">

                    <button class="tab active" id="login-tab" type="button">Login</button>
                    <button class="tab" id="signup-tab" type="button">Sign Up</button>

                </div>

                <form id="login-form" class="auth-form">

                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="email" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox" id="remember-me">
                            <span>Remember Me</span>
                        </label>

                        <button type="button" class="forgot-password">Forgot Password?</button>

                    </div>

                    <button type="submit" class="primary-button" id="submit-login">ENTER NEXUS</button>
                </form>

                <form id="signup-form" class="auth-form hidden">

                    <div class="form-group">
                        <label for="signup-username">Username</label>
                        <input type="text" id="signup-username" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="primary-button">JOIN NEXUS</button>

                </form>

                <div class="auth-footer">

                    <span id="footer-text">Don't have an account?</span>
                    <button id="switch-auth" type="button">Create One</button>

                </div>

            </div>

        </section>
        
    </main>
    <section id="app-content">
            
        <section id="dashboard-view" class="app-view">

            <header class="dashboard-header">
                <div>
                    <p class="section-label">NEXUS COMMAND</p>
                    <h1>Welcome back, <span id="player-name">Nexus Player</span></h1>
                    <p class="dashboard-subtitle">
                        Your journey continues.
                    </p>
                </div>
            </header>


            <section class="player-status">

                <div class="status-card">
                    <span class="status-label">LEVEL</span>
                    <strong id="player-level">1</strong>
                </div>

                <div class="status-card">
                    <span class="status-label">XP</span>
                    <strong>
                        <span id="player-xp">0</span>
                        <span class="xp-required">
                            / <span id="xp-required">100</span>
                        </span>
                    </strong>
                </div>

                <div class="status-card">
                    <span class="status-label">STREAK</span>
                    <strong id="player-streak">0</strong>
                    <span class="status-unit">DAYS</span>
                </div>

            </section>


            <section class="xp-section">

                <div class="xp-header">
                    <span>EXPERIENCE</span>

                    <span>
                        <span id="xp-current">0</span>
                        /
                        <span id="xp-total">100</span>
                        XP
                    </span>
                </div>

                <div class="xp-bar">
                    <div id="xp-progress" class="xp-progress"></div>
                </div>

            </section>


            <section class="quests-section">

                <div class="section-heading">
                    <div>
                        <p class="section-label">TODAY</p>
                        <h2>Daily Quests</h2>
                    </div>

                    <button id="add-quest-button" class="secondary-button">
                        + ADD QUEST
                    </button>
                </div>


                <div id="quest-list" class="quest-list"></div>

            </section>

        </section>

    </section>

    <script src="script.js"></script>

</body>
</html>
